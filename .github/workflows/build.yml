name: Build EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'saka.py'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name saka saka.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: saka-exe
          path: dist/saka.exe
          
